name: Actualizar Ofertas Automáticamente

on:
  schedule:
    # Se ejecuta cada 6 horas automáticamente
    - cron: '0 */6 * * *'
  # Permite ejecutarlo manualmente desde la pestaña "Acciones"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar Scrapers de Tiendas
        run: |
          python -c "
          import json
          from exito import extraer_exito
          from falabella import extraer_falabella
          from alkosto import extraer_alkosto
          from ktronix import extraer_ktronix

          ofertas = []
          for fn in [extraer_exito, extraer_falabella, extraer_alkosto, extraer_ktronix]:
              try:
                  res = fn()
                  if res:
                      ofertas.extend(res)
              except Exception as e:
                  print(f'Error en {fn.__name__}: {e}')

          if ofertas:
              with open('ofertas.json', 'w', encoding='utf-8') as f:
                  json.dump(ofertas, f, ensure_ascii=False, indent=2)
              print(f'Total ofertas guardadas: {len(ofertas)}')
          else:
              print('No se extrajeron ofertas nuevas en esta corrida.')
          "

      - name: Guardar Cambios en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ofertas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de ofertas" && git pull --rebase origin main && git push)
