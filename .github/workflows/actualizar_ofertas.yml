name: Actualizador Nocturno de Gangas

on:
  schedule:
    - cron: '0 5 * * *'  # Se ejecuta automáticamente todos los días
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Ejecutar Extractor Nocturno Multitienda
      env:
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
      run: |
        python -c "
        import json, time, sys, os
        sys.path.append('extractores')

        from exito import extraer_exito
        from alkosto import extraer_alkosto
        from ktronix import extraer_ktronix
        from falabella import extraer_falabella

        todas_ofertas = []

        # 1. Éxito
        try:
            print('--- Iniciando Éxito ---')
            of_exito = extraer_exito()
            print(f'Éxito aportó: {len(of_exito)} ofertas')
            todas_ofertas.extend(of_exito)
        except Exception as e:
            print('Error crítico en Éxito:', e)

        # 2. Alkosto
        try:
            print('--- Iniciando Alkosto ---')
            of_alkosto = extraer_alkosto()
            print(f'Alkosto aportó: {len(of_alkosto)} ofertas')
            todas_ofertas.extend(of_alkosto)
        except Exception as e:
            print('Error crítico en Alkosto:', e)

        # 3. Ktronix
        try:
            print('--- Iniciando Ktronix ---')
            of_ktronix = extraer_ktronix()
            print(f'Ktronix aportó: {len(of_ktronix)} ofertas')
            todas_ofertas.extend(of_ktronix)
        except Exception as e:
            print('Error crítico en Ktronix:', e)

        # 4. Falabella
        try:
            print('--- Iniciando Falabella ---')
            of_falabella = extraer_falabella()
            print(f'Falabella aportó: {len(of_falabella)} ofertas')
            todas_ofertas.extend(of_falabella)
        except Exception as e:
            print('Error crítico en Falabella:', e)

        print(f'TOTAL GENERAL GUARDADO: {len(todas_ofertas)} ofertas')

        with open('ofertas.json', 'w', encoding='utf-8') as f:
            json.dump(todas_ofertas, f, ensure_ascii=False, indent=2)
        "

    - name: Guardar Cambios en GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add ofertas.json
        git commit -m "🤖 Actualización automática de gangas multitienda" || exit 0
        git push
