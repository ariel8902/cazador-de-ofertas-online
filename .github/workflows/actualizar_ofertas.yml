name: Cazador de Ofertas Online

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  scrape-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml playwright
          playwright install chromium

      - name: Ejecutar Scrapers de Tiendas
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          python -u -c "
          import json
          import os
          from exito import extraer_exito

          archivo_datos = 'ofertas.json'
          ofertas_actuales = []

          if os.path.exists(archivo_datos):
              try:
                  with open(archivo_datos, 'r', encoding='utf-8') as f:
                      ofertas_actuales = json.load(f)
              except Exception:
                  ofertas_actuales = []

          otras_tiendas = [o for o in ofertas_actuales if o.get('tienda') != 'Éxito']
          nuevas_exito = extraer_exito()

          total_ofertas = otras_tiendas + nuevas_exito

          with open(archivo_datos, 'w', encoding='utf-8') as f:
              json.dump(total_ofertas, f, indent=2, ensure_ascii=False)

          print(f'Total ofertas guardadas: {len(total_ofertas)} (Nuevas de exito: {len(nuevas_exito)})')
          "

      - name: Guardar Cambios en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de ofertas" && git push)
