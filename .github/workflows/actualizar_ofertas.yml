name: Actualizar Ofertas Automáticamente

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tienda:
        description: 'Tienda a ejecutar (para pruebas rápidas)'
        required: true
        default: 'exito'
        type: choice
        options:
          - exito
          - falabella
          - alkosto
          - ktronix
          - todas

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scrapers de Tiendas
        env:
          TIENDA_OBJETIVO: ${{ github.event.inputs.tienda || 'todas' }}
        run: |
          python -u -c "
          import os, json
          from exito import extraer_exito
          from falabella import extraer_falabella
          from alkosto import extraer_alkosto
          from ktronix import extraer_ktronix

          objetivo = os.getenv('TIENDA_OBJETIVO', 'todas').lower()
          mapa = {
              'exito': ('Éxito', extraer_exito),
              'falabella': ('Falabella', extraer_falabella),
              'alkosto': ('Alkosto', extraer_alkosto),
              'ktronix': ('Ktronix', extraer_ktronix),
          }

          seleccion = list(mapa.values()) if objetivo == 'todas' else [mapa[objetivo]]

          # Si probamos una sola tienda, conservamos las ofertas previas de las demás
          ofertas_previas = []
          if objetivo != 'todas' and os.path.exists('ofertas.json'):
              try:
                  with open('ofertas.json', 'r', encoding='utf-8') as f:
                      nombre_actual = mapa[objetivo][0]
                      ofertas_previas = [o for o in json.load(f) if o.get('Almacen') != nombre_actual]
              except Exception:
                  ofertas_previas = []

          nuevas = []
          for nombre, fn in seleccion:
              try:
                  res = fn()
                  if res:
                      nuevas.extend(res)
              except Exception as e:
                  print(f'Error en {fn.__name__}: {e}')

          total = ofertas_previas + nuevas
          if total:
              with open('ofertas.json', 'w', encoding='utf-8') as f:
                  json.dump(total, f, ensure_ascii=False, indent=2)
              print(f'Total ofertas guardadas: {len(total)} (Nuevas de {objetivo}: {len(nuevas)})')
          else:
              print('No se extrajeron ofertas nuevas en esta corrida.')
          "

      - name: Guardar Cambios en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ofertas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de ofertas" && git pull --rebase origin main && git push)
