name: Cazador de Ofertas Online

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  scrape-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml playwright
          playwright install chromium

      - name: Ejecutar Scrapers de Tiendas
        run: |
          python -u -c "
          import json
          import os
          from exito import extraer_exito

          archivo_datos = 'ofertas.json'
          nuevas_exito = extraer_exito()

          # Sobrescribir limpiamente para que no arrastre basura ni datos estáticos de otras tiendas
          with open(archivo_datos, 'w', encoding='utf-8') as f:
              json.dump(nuevas_exito, f, indent=2, ensure_ascii=False)

          print(f'Total ofertas guardadas en vitrina (Éxito): {len(nuevas_exito)}')
          "

      - name: Guardar Cambios en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de ofertas" && git push)
